[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nse-pulse"
version = "0.2.0"
description = "Personal NSE EOD scraper + research dashboard (equity / index / F&O / flows)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "NSE Pulse" }]
keywords = ["nse", "stocks", "finance", "scraper", "streamlit", "research"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
]

dependencies = [
    "curl_cffi>=0.7,<2.0",
    "requests==2.32.3",
    "Brotli>=1.0,<2.0",
    "pydantic==2.9.2",
    "SQLAlchemy==2.0.36",
    "loguru==0.7.2",
    "pyyaml==6.0.2",
    "pandas==2.2.3",
    "numpy==1.26.4",
    "pyarrow==18.0.0",
    "scipy==1.14.1",
    "streamlit==1.40.0",
    "plotly==5.24.1",
    "APScheduler==3.10.4",
    "python-dateutil==2.9.0.post0",
    "duckdb>=1.1,<2.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "nse",
    "python-dotenv>=1.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "yfinance>=0.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-cov>=5.0,<6.0",
    "freezegun==1.5.1",
    "ruff>=0.6,<1.0",
    "mypy>=1.10,<2.0",
    "pre-commit>=3.7,<5.0",
    "hypothesis>=6.100,<7.0",
    "types-PyYAML",
    "types-requests",
]

[project.scripts]
nse-pulse = "orchestrator:cli"
nse-pulse-run = "src.launcher:cli"
nse-pulse-fetch-holidays = "src.utils.holiday_fetcher:cli"
nse-pulse-alerts = "src.alerts.runner:cli"
nse-pulse-healthz = "src.utils.healthz:cli"

[project.urls]
Issues = "https://github.com/local/nse-pulse/issues"

[tool.setuptools]
package-dir = { "" = "." }

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
exclude = ["tests*", "logs*", "data*", ".venv*"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv", "data", "logs", "docs"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle + pyflakes
    "I",             # isort
    "B",             # bugbear
    "UP",            # pyupgrade
    "SIM",           # simplify
]
ignore = [
    "E501",   # line length (handled by formatter)
    "B008",   # function call in default arg (typer/streamlit pattern)
    "SIM108", # ternary readability
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B018"]
"src/webapp/*" = ["E402"]  # streamlit requires set_page_config before imports

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = false
check_untyped_defs = true
warn_return_any = false
show_error_codes = true
exclude = ["\\.venv", "tests", "data", "logs"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = [
    "integration: tests that hit the network (skipped in CI)",
]

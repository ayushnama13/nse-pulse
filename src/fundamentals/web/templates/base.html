<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}stock_db{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .num   { font-variant-numeric: tabular-nums; text-align: right; }
    .pos   { color: #16a34a; }
    .neg   { color: #dc2626; }
    .table-zebra tbody tr:nth-child(odd) { background: #f9fafb; }
    .table-zebra tbody tr:hover          { background: #eef2ff; }
    .pill  { display:inline-block; padding: 1px 8px; border-radius: 9999px; font-size: 11px; font-weight: 500; }
    .pill-ok    { background:#dcfce7; color:#166534; }
    .pill-warn  { background:#fef9c3; color:#854d0e; }
    .pill-err   { background:#fee2e2; color:#991b1b; }
    .pill-unhealthy { background:#fde68a; color:#92400e; }
    .pill-info  { background:#e0e7ff; color:#3730a3; }
    .scroll-x  { overflow-x: auto; }
    code, pre { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  </style>
  {% block head %}{% endblock %}
</head>
<body class="bg-slate-50 text-slate-900">
  <header class="bg-slate-900 text-slate-100 shadow">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-6">
        <a href="/" class="font-bold text-lg tracking-tight">stock_db</a>
        <nav class="flex gap-4 text-sm">
          <a href="/"           class="hover:text-white text-slate-300">Dashboard</a>
          <a href="/companies"  class="hover:text-white text-slate-300">Companies</a>
          <a href="/sectors"    class="hover:text-white text-slate-300">Sectors</a>
          <a href="/top"        class="hover:text-white text-slate-300">Top</a>
          <a href="/screens"    class="hover:text-white text-slate-300">Screens</a>
          <a href="/sql"        class="hover:text-white text-slate-300">SQL</a>
          <a href="/sources"    class="hover:text-white text-slate-300">Sources</a>
          <a href="/admin/health" class="hover:text-white text-slate-300">Health</a>
        </nav>
      </div>
      <form action="/companies" method="get" class="flex">
        <input type="text" name="q" placeholder="Search symbol or name…"
               class="px-3 py-1.5 text-sm rounded-l bg-slate-800 border border-slate-700 text-slate-100 placeholder-slate-400 focus:outline-none focus:border-blue-500 w-64">
        <button class="bg-blue-600 hover:bg-blue-500 text-white text-sm px-3 rounded-r">Go</button>
      </form>
    </div>
  </header>
  <main class="max-w-7xl mx-auto px-4 py-6">
    {% block content %}{% endblock %}
  </main>
  <footer class="text-center text-xs text-slate-400 py-6">
    NSE/BSE fundamentals · all money in crores · FY = year-ending in March
  </footer>
</body>
</html>

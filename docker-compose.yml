services:
  webapp:
    build: .
    container_name: nse-pulse-webapp
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config:/app/config
    env_file:
      - .env
    command: uvicorn src.oipulse.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Daily EOD pull at 18:30 IST via in-container cron.
  scheduler:
    build: .
    container_name: nse-pulse-scheduler
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config:/app/config
    env_file:
      - .env
    command: python -m src.utils.scheduler
    depends_on:
      - webapp

  # Ad-hoc CLI: `docker compose run --rm orchestrator --date today`
  orchestrator:
    build: .
    profiles: ["cli"]
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config:/app/config
    env_file:
      - .env
    entrypoint: ["python", "orchestrator.py"]
